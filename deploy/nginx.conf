# OpenGantt Nginx 反向代理配置（裸机部署方案使用）
# 复制到 /etc/nginx/conf.d/opengantt.conf 后执行 nginx -t && systemctl reload nginx
#
# 用途：80/443 入口 → 静态文件直出 + API 转发到 uvicorn(127.0.0.1:8000)

server {
    listen 80;
    server_name _;                # 替换为你的域名，如 gantt.example.com

    # 前端静态文件（本机构建产物）
    root /opt/opengantt/frontend/dist;
    index index.html;

    # 带哈希的静态资源：长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 入口页禁缓存：发新版后浏览器立即拿到新 index.html（SPA 回退也命中此处）
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # API 转发到后端
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其余路径全部回退到 index.html（SPA）
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS（推荐，用免费工具 certbot 申请 Let's Encrypt 证书）：
#   sudo certbot --nginx -d gantt.example.com
# certbot 会自动改写本文件增加 443 配置与证书路径。
